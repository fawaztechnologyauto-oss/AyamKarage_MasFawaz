<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pengeluaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Header Navigasi -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Kembali ke Home</a>
        <h2 class="fw-bold mb-0">Halaman Pengeluaran</h2>
      </div>
      <!-- Panggil fungsi openAddModal() -->
      <button class="btn btn-danger" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> Tambah Pengeluaran</button>
    </div>

    <!-- Section Filter & Ringkasan Total -->
    <div class="row g-3 align-items-center mb-4">
      <div class="col-md-8">
        <div class="card border-0 shadow-sm p-3">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label small text-muted">Pilih Tanggal Exact</label>
              <input type="date" id="filterTanggal" class="form-control" onchange="filterData()">
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Pilih Bulan</label>
              <select id="filterBulan" class="form-select" onchange="filterData()">
                <option value="">Semua Bulan</option>
                <option value="01">Januari</option>
                <option value="02">Februari</option>
                <option value="03">Maret</option>
                <option value="04">April</option>
                <option value="05">Mei</option>
                <option value="06">Juni</option>
                <option value="07">Juli</option>
                <option value="08">Agustus</option>
                <option value="09">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Pilih Tahun</label>
              <select id="filterTahun" class="form-select" onchange="filterData()">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-danger text-white p-3 text-center">
          <span class="small">Total Pengeluaran Bulan Ini</span>
          <h3 class="fw-bold my-1" id="displayTotal">Rp 0</h3>
        </div>
      </div>
    </div>

    <!-- Tabel Data Pengeluaran -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID Trx</th>
                <th>Tanggal</th>
                <th>Jenis Pengeluaran</th>
                <th>Kategori / Deskripsi</th>
                <th>Jumlah</th>
                <th>Harga Satuan</th>
                <th>Total</th>
                <th class="text-center" style="width: 120px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="8" class="text-center py-4">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Form (Satu Modal untuk Tambah & Edit) -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalTitle">Tambah Pengeluaran</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPengeluaran" onsubmit="submitForm(event)">
          <div class="modal-body">
            <!-- Hidden ID untuk menyimpan ID saat Edit -->
            <input type="hidden" id="inputId">

            <div class="mb-3">
              <label class="form-label">Tanggal</label>
              <input type="date" id="inputTanggal" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jenis Pengeluaran</label>
              <select id="inputJenis" class="form-select" required>
                <option value="" disabled selected>-- Pilih Jenis --</option>
                <option value="Bahan Baku">Bahan Baku</option>
                <option value="Operasional">Operasional</option>
                <option value="Gaji Karyawan">Gaji Karyawan</option>
                <option value="Sewa Tempat">Sewa Tempat</option>
                <option value="Listrik & Air">Listrik & Air</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Kategori / Deskripsi</label>
              <input type="text" id="inputKategori" class="form-control" placeholder="Contoh: Ayam Fillet Biasa" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jumlah (Qty)</label>
              <input type="number" id="inputJumlah" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Harga Satuan (Rp)</label>
              <input type="number" id="inputHarga" class="form-control" min="0" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-danger" id="btnSubmit">Simpan Data</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFDfsQkCifBlgsgtmQ0Z68SSlDbAiqeGBGAmgEH8rCRsVf0vgrCKt-pqkt-hOqnS0s/exec";
    let allData = [];
    let modalInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      modalInstance = new bootstrap.Modal(document.getElementById('modalForm'));
      loadData();
    });

    async function loadData() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getPengeluaran`);
        allData = await response.json();
        filterData();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">Gagal memuat data. Pastikan URL Web App benar.</td></tr>`;
      }
    }

    function filterData() {
      const tgl = document.getElementById('filterTanggal').value;
      const bln = document.getElementById('filterBulan').value;
      const thn = document.getElementById('filterTahun').value;

      let filtered = allData.filter(item => {
        // Hanya tampilkan data transaksi yang jenisnya BUKAN Pemasukan
        let isPengeluaran = item.jenis !== 'Pemasukan';

        let dateObj = new Date(item.tanggal);
        let itemThn = dateObj.getFullYear().toString();
        let itemBln = String(dateObj.getMonth() + 1).padStart(2, '0');
        
        let matchThn = !thn || itemThn === thn;
        let matchBln = !bln || itemBln === bln;
        let matchTgl = !tgl || item.tanggal === tgl;

        return isPengeluaran && matchThn && matchBln && matchTgl;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      let totalPengeluaran = 0;

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">Tidak ada data pengeluaran.</td></tr>`;
      } else {
        data.forEach(row => {
          let totalRow = Number(row.jumlah) * Number(row.hargaSatuan);
          totalPengeluaran += totalRow;

          tbody.innerHTML += `
            <tr>
              <td>${row.id}</td>
              <td>${row.tanggal}</td>
              <td><span class="badge bg-danger">${row.jenis || 'Pengeluaran'}</span></td>
              <td>${row.kategori}</td>
              <td>${row.jumlah}</td>
              <td>Rp ${Number(row.hargaSatuan).toLocaleString('id-ID')}</td>
              <td class="fw-bold">Rp ${Number(totalRow).toLocaleString('id-ID')}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-warning me-1" onclick="openEditModal('${row.id}')" title="Edit Data">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteData('${row.id}')" title="Hapus Data">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });
      }

      document.getElementById('displayTotal').innerText = `Rp ${Number(totalPengeluaran).toLocaleString('id-ID')}`;
    }

    // Modal untuk Tambah Data
    function openAddModal() {
      document.getElementById('formPengeluaran').reset();
      document.getElementById('inputId').value = '';
      document.getElementById('modalTitle').innerText = 'Tambah Pengeluaran';
      document.getElementById('btnSubmit').innerText = 'Simpan Data';
      modalInstance.show();
    }

    // Modal untuk Edit Data
    function openEditModal(id) {
      const item = allData.find(d => String(d.id) === String(id));
      if (!item) {
        alert('Data tidak ditemukan!');
        return;
      }

      document.getElementById('inputId').value = item.id;
      document.getElementById('inputTanggal').value = item.tanggal;
      document.getElementById('inputJenis').value = item.jenis || '';
      document.getElementById('inputKategori').value = item.kategori;
      document.getElementById('inputJumlah').value = item.jumlah;
      document.getElementById('inputHarga').value = item.hargaSatuan;

      document.getElementById('modalTitle').innerText = 'Edit Pengeluaran';
      document.getElementById('btnSubmit').innerText = 'Update Data';
      modalInstance.show();
    }

    // Simpan Data (Handling Tambah & Edit)
    async function submitForm(e) {
      e.preventDefault();
      
      const id = document.getElementById('inputId').value;
      const isEdit = Boolean(id);

      const payload = {
        action: isEdit ? 'updateTransaction' : 'addTransaction',
        payload: {
          id: isEdit ? id : 'TRX-' + Date.now(),
          tanggal: document.getElementById('inputTanggal').value,
          jenis: document.getElementById('inputJenis').value, // Mengirim jenis pilihan seperti "Bahan Baku" ke Kolom C Sheet
          kategori: document.getElementById('inputKategori').value,
          jumlah: Number(document.getElementById('inputJumlah').value),
          hargaSatuan: Number(document.getElementById('inputHarga').value),
          total: Number(document.getElementById('inputJumlah').value) * Number(document.getElementById('inputHarga').value),
          keuntungan: 0
        }
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        modalInstance.hide();
        loadData();
      } catch (err) {
        alert('Gagal menyimpan data!');
      }
    }

    // Hapus Data (Delete)
    async function deleteData(id) {
      if (!confirm(`Apakah Anda yakin ingin menghapus transaksi dengan ID: ${id}?`)) return;

      const payload = {
        action: 'deleteTransaction',
        id: id
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        loadData();
      } catch (err) {
        alert('Gagal menghapus data!');
      }
    }
  </script>
</body>
</html>
