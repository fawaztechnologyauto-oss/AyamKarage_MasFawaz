<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pemasukan / Penjualan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Header Navigasi -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Kembali ke Home</a>
        <h2 class="fw-bold mb-0">Halaman Pemasukan & Penjualan</h2>
      </div>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalTambah"><i class="bi bi-plus-lg"></i> Catat Penjualan</button>
    </div>

    <!-- Section Filter & Ringkasan Total & Profit -->
    <div class="row g-3 align-items-center mb-4">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm p-3">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label small text-muted">Tanggal</label>
              <input type="date" id="filterTanggal" class="form-control" onchange="filterData()">
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Bulan</label>
              <select id="filterBulan" class="form-select" onchange="filterData()">
                <option value="">Semua Bulan</option>
                <option value="01">Januari</option>
                <option value="02">Februari</option>
                <option value="03">Maret</option>
                <option value="04">April</option>
                <option value="05">Mei</option>
                <option value="06">Juni</option>
                <option value="07">Juli</option>
                <option value="08">Agustus</option>
                <option value="09">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Tahun</label>
              <select id="filterTahun" class="form-select" onchange="filterData()">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-success text-white p-3 text-center">
          <span class="small">Total Penjualan</span>
          <h4 class="fw-bold my-1" id="displayTotalPenjualan">Rp 0</h4>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-primary text-white p-3 text-center">
          <span class="small">Total Keuntungan (Profit)</span>
          <h4 class="fw-bold my-1" id="displayTotalProfit">Rp 0</h4>
        </div>
      </div>
    </div>

    <!-- Tabel Data Pemasukan -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID Trx</th>
                <th>Tanggal</th>
                <th>Menu Masakan</th>
                <th>Qty Terjual</th>
                <th>Harga Satuan</th>
                <th>Total Pemasukan</th>
                <th class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center py-4">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Penjualan -->
  <div class="modal fade" id="modalTambah" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Input Penjualan / Pemasukan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPemasukan" onsubmit="submitForm(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Tanggal Transaksi</label>
              <input type="date" id="inputTanggal" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Nama Menu Masakan</label>
              <input type="text" id="inputMenu" class="form-control" placeholder="Contoh: Ayam Karage" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jumlah Terjual (Qty)</label>
              <input type="number" id="inputJumlah" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Harga Jual Satuan (Rp)</label>
              <input type="number" id="inputHarga" class="form-control" min="0" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-success" id="btnSimpanTambah">Simpan & Potong Stok</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Edit Penjualan -->
  <div class="modal fade" id="modalEdit" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Penjualan / Pemasukan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formEditPemasukan" onsubmit="submitEditForm(event)">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Tanggal Transaksi</label>
              <input type="date" id="editTanggal" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Nama Menu Masakan</label>
              <input type="text" id="editMenu" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jumlah Terjual (Qty)</label>
              <input type="number" id="editJumlah" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Harga Jual Satuan (Rp)</label>
              <input type="number" id="editHarga" class="form-control" min="0" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary" id="btnSimpanEdit">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFDfsQkCifBlgsgtmQ0Z68SSlDbAiqeGBGAmgEH8rCRsVf0vgrCKt-pqkt-hOqnS0s/exec";
    let dataPemasukan = [];
    let dataPengeluaran = [];

    // Set tanggal default ke hari ini
    document.getElementById('inputTanggal').valueAsDate = new Date();

    async function loadData() {
      try {
        const [resPemasukan, resPengeluaran] = await Promise.all([
          fetch(`${WEB_APP_URL}?action=getPemasukan`),
          fetch(`${WEB_APP_URL}?action=getPengeluaran`)
        ]);

        dataPemasukan = await resPemasukan.json();
        dataPengeluaran = await resPengeluaran.json();

        filterData();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Gagal memuat data.</td></tr>`;
      }
    }

    function filterData() {
      const tgl = document.getElementById('filterTanggal').value;
      const bln = document.getElementById('filterBulan').value;
      const thn = document.getElementById('filterTahun').value;

      let filteredPemasukan = dataPemasukan.filter(item => {
        let dateObj = new Date(item.tanggal);
        let itemThn = dateObj.getFullYear().toString();
        let itemBln = String(dateObj.getMonth() + 1).padStart(2, '0');
        return (!thn || itemThn === thn) && (!bln || itemBln === bln) && (!tgl || item.tanggal === tgl);
      });

      let filteredPengeluaran = dataPengeluaran.filter(item => {
        let dateObj = new Date(item.tanggal);
        let itemThn = dateObj.getFullYear().toString();
        let itemBln = String(dateObj.getMonth() + 1).padStart(2, '0');
        return (!thn || itemThn === thn) && (!bln || itemBln === bln) && (!tgl || item.tanggal === tgl);
      });

      renderTable(filteredPemasukan, filteredPengeluaran);
    }

    function renderTable(pemasukanList, pengeluaranList) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let totalPenjualan = 0;
      let totalPengeluaran = 0;

      pengeluaranList.forEach(item => {
        totalPengeluaran += (item.jumlah * item.hargaSatuan);
      });

      if (pemasukanList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada data penjualan pada periode ini.</td></tr>`;
      } else {
        pemasukanList.forEach(row => {
          let omsetRow = row.jumlah * row.hargaSatuan;
          totalPenjualan += omsetRow;

          tbody.innerHTML += `
            <tr>
              <td><small class="fw-semibold text-secondary">${row.id}</small></td>
              <td>${row.tanggal}</td>
              <td>${row.kategori}</td>
              <td>${row.jumlah}</td>
              <td>Rp ${Number(row.hargaSatuan).toLocaleString('id-ID')}</td>
              <td class="fw-bold text-success">Rp ${Number(omsetRow).toLocaleString('id-ID')}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-warning me-1" onclick="openEditModal('${row.id}', '${row.tanggal}', '${escapeQuotes(row.kategori)}', ${row.jumlah}, ${row.hargaSatuan})">
                  <i class="bi bi-pencil-square"></i> Edit
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteData('${row.id}')">
                  <i class="bi bi-trash"></i> Hapus
                </button>
              </td>
            </tr>
          `;
        });
      }

      let totalKeuntungan = totalPenjualan - totalPengeluaran;

      document.getElementById('displayTotalPenjualan').innerText = `Rp ${Number(totalPenjualan).toLocaleString('id-ID')}`;
      
      const profitElement = document.getElementById('displayTotalProfit');
      profitElement.innerText = `Rp ${Number(totalKeuntungan).toLocaleString('id-ID')}`;
      if (totalKeuntungan < 0) {
        profitElement.parentElement.classList.remove('bg-primary');
        profitElement.parentElement.classList.add('bg-danger');
      } else {
        profitElement.parentElement.classList.remove('bg-danger');
        profitElement.parentElement.classList.add('bg-primary');
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpanTambah');
      btn.disabled = true;
      btn.innerText = 'Menyimpan...';

      const qty = Number(document.getElementById('inputJumlah').value);
      const harga = Number(document.getElementById('inputHarga').value);

      const payload = {
        action: 'addTransaction',
        payload: {
          id: 'TRX-' + Date.now(),
          tanggal: document.getElementById('inputTanggal').value,
          jenis: 'Pemasukan',
          kategori: document.getElementById('inputMenu').value,
          jumlah: qty,
          hargaSatuan: harga,
          total: qty * harga,
          keuntungan: 0
        }
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        bootstrap.Modal.getInstance(document.getElementById('modalTambah')).hide();
        document.getElementById('formPemasukan').reset();
        document.getElementById('inputTanggal').valueAsDate = new Date();
        loadData();
      } catch (err) {
        alert("Gagal menyimpan transaksi.");
      } finally {
        btn.disabled = false;
        btn.innerText = 'Simpan & Potong Stok';
      }
    }

    function openEditModal(id, tanggal, menu, jumlah, hargaSatuan) {
      document.getElementById('editId').value = id;
      document.getElementById('editTanggal').value = tanggal;
      document.getElementById('editMenu').value = menu;
      document.getElementById('editJumlah').value = jumlah;
      document.getElementById('editHarga').value = hargaSatuan;

      const editModal = new bootstrap.Modal(document.getElementById('modalEdit'));
      editModal.show();
    }

    async function submitEditForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpanEdit');
      btn.disabled = true;
      btn.innerText = 'Memperbarui...';

      const id = document.getElementById('editId').value;
      const tanggal = document.getElementById('editTanggal').value;
      const menu = document.getElementById('editMenu').value;
      const jumlah = Number(document.getElementById('editJumlah').value);
      const hargaSatuan = Number(document.getElementById('editHarga').value);

      const payload = {
        action: 'updateTransaction',
        payload: {
          id: id,
          tanggal: tanggal,
          kategori: menu,
          jumlah: jumlah,
          hargaSatuan: hargaSatuan,
          total: jumlah * hargaSatuan
        }
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        bootstrap.Modal.getInstance(document.getElementById('modalEdit')).hide();
        loadData();
      } catch (err) {
        alert("Gagal memperbarui transaksi.");
      } finally {
        btn.disabled = false;
        btn.innerText = 'Simpan Perubahan';
      }
    }

    async function deleteData(idTrx) {
      if (!confirm(`Apakah Anda yakin ingin menghapus transaksi ${idTrx}?`)) return;

      try {
        const payload = {
          action: 'deleteTransaction',
          payload: { id: idTrx }
        };

        await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        loadData();
      } catch (err) {
        alert("Gagal menghapus data.");
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
