<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pemasukan / Penjualan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <!-- Header Navigasi & User Info -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Kembali ke Home</a>
        <h2 class="fw-bold mb-0">Halaman Pemasukan & Penjualan</h2>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-success" onclick="openAddModal()"><i class="bi bi-plus-lg"></i> Catat Penjualan</button>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>

    <!-- Section Filter & Ringkasan Total & Profit -->
    <div class="row g-3 align-items-center mb-4">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm p-3">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label small text-muted">Tanggal</label>
              <input type="date" id="filterTanggal" class="form-control" onchange="filterData()">
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Bulan</label>
              <select id="filterBulan" class="form-select" onchange="filterData()">
                <option value="">Semua Bulan</option>
                <option value="01">Januari</option>
                <option value="02">Februari</option>
                <option value="03">Maret</option>
                <option value="04">April</option>
                <option value="05">Mei</option>
                <option value="06">Juni</option>
                <option value="07">Juli</option>
                <option value="08">Agustus</option>
                <option value="09">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small text-muted">Tahun</label>
              <select id="filterTahun" class="form-select" onchange="filterData()">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-success text-white p-3 text-center">
          <span class="small">Total Penjualan</span>
          <h4 class="fw-bold my-1" id="displayTotalPenjualan">Rp 0</h4>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-primary text-white p-3 text-center">
          <span class="small">Total Keuntungan (Profit)</span>
          <h4 class="fw-bold my-1" id="displayTotalProfit">Rp 0</h4>
        </div>
      </div>
    </div>

    <!-- Tabel Data Pemasukan -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID Trx</th>
                <th>Tanggal</th>
                <th>Menu Masakan</th>
                <th>Qty Terjual</th>
                <th>Harga Satuan</th>
                <th>Total Pemasukan</th>
                <th class="text-center" style="width: 130px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center py-4">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Form (Tambah / Edit Multi-Item) -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalTitle">Catat Penjualan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formPemasukan" onsubmit="submitForm(event)">
          <div class="modal-body">
            <input type="hidden" id="inputId">

            <div class="mb-3">
              <label class="form-label">Tanggal Transaksi</label>
              <input type="date" id="inputTanggal" class="form-control" required>
            </div>

            <hr>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-bold mb-0">Daftar Menu yang Dibeli (Maks. 10 Item)</label>
              <button type="button" class="btn btn-outline-primary btn-sm" id="btnAddItemRow" onclick="addItemRow()">
                <i class="bi bi-plus-circle"></i> Tambah Item Lain
              </button>
            </div>

            <!-- Container Baris Item Dinamis -->
            <div id="itemRowsContainer" class="vstack gap-3">
              <!-- Baris item akan dimasukkan via JavaScript -->
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-success" id="btnSubmit">Simpan & Potong Stok</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFDfsQkCifBlgsgtmQ0Z68SSlDbAiqeGBGAmgEH8rCRsVf0vgrCKt-pqkt-hOqnS0s/exec";
    let dataPemasukan = [];
    let dataPengeluaran = [];
    let listResepMenu = [];
    let modalInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('userSession'));
      if (!session) {
        alert('Sesi habis atau Anda belum login. Silakan login terlebih dahulu.');
        window.location.href = 'login.html';
        return;
      }

      modalInstance = new bootstrap.Modal(document.getElementById('modalForm'));
      loadData();
    });

    async function loadData() {
      try {
        const [resPemasukan, resPengeluaran, resResep] = await Promise.all([
          fetch(`${WEB_APP_URL}?action=getPemasukan`),
          fetch(`${WEB_APP_URL}?action=getPengeluaran`),
          fetch(`${WEB_APP_URL}?action=getResepMenu`)
        ]);

        dataPemasukan = await resPemasukan.json();
        dataPengeluaran = await resPengeluaran.json();
        listResepMenu = await resResep.json();

        filterData();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Gagal memuat data.</td></tr>`;
      }
    }

    function getMenuOptionsHTML(selectedMenu = '') {
      let options = '<option value="" disabled selected>-- Pilih Menu --</option>';
      if (listResepMenu && listResepMenu.length > 0) {
        const uniqueMenus = [...new Set(listResepMenu.map(item => item.namaMenu).filter(Boolean))];
        uniqueMenus.forEach(menuName => {
          const isSel = menuName === selectedMenu ? 'selected' : '';
          options += `<option value="${menuName}" ${isSel}>${menuName}</option>`;
        });
      } else {
        options = '<option value="" disabled>-- Tidak Ada Menu --</option>';
      }
      return options;
    }

    function addItemRow(menu = '', qty = '', harga = '') {
      const container = document.getElementById('itemRowsContainer');
      const currentRows = container.querySelectorAll('.item-row');
      
      if (currentRows.length >= 10) {
        alert('Maksimal 10 jenis item per transaksi!');
        return;
      }

      const rowIndex = currentRows.length;
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row g-2 align-items-center item-row p-2 border rounded bg-white shadow-sm';
      rowDiv.innerHTML = `
        <div class="col-md-5">
          <label class="form-label small text-muted mb-1">Menu Masakan</label>
          <select class="form-select form-select-sm item-menu" required>
            ${getMenuOptionsHTML(menu)}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-muted mb-1">Qty Terjual</label>
          <input type="number" class="form-control form-control-sm item-qty" min="1" value="${qty}" placeholder="Qty" required>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-muted mb-1">Harga Satuan (Rp)</label>
          <input type="number" class="form-control form-control-sm item-harga" min="0" value="${harga}" placeholder="Harga" required>
        </div>
        <div class="col-md-1 text-center pt-3">
          <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeItemRow(this)" title="Hapus Baris">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      `;
      container.appendChild(rowDiv);
      toggleAddButtonState();
    }

    function removeItemRow(btn) {
      const container = document.getElementById('itemRowsContainer');
      if (container.querySelectorAll('.item-row').length <= 1) {
        alert('Minimal harus ada 1 item menu dalam transaksi.');
        return;
      }
      btn.closest('.item-row').remove();
      toggleAddButtonState();
    }

    function toggleAddButtonState() {
      const container = document.getElementById('itemRowsContainer');
      const addBtn = document.getElementById('btnAddItemRow');
      if (container.querySelectorAll('.item-row').length >= 10) {
        addBtn.disabled = true;
      } else {
        addBtn.disabled = false;
      }
    }

    function parseDateString(rawDate) {
      if (!rawDate) return { thn: '', bln: '', tglFormat: '', cleanDate: '' };

      let d = new Date(rawDate);
      if (!isNaN(d.getTime())) {
        let thn = d.getFullYear().toString();
        let bln = String(d.getMonth() + 1).padStart(2, '0');
        let tgl = String(d.getDate()).padStart(2, '0');
        return {
          thn: thn,
          bln: bln,
          tglFormat: `${thn}-${bln}-${tgl}`,
          cleanDate: `${thn}-${bln}-${tgl}`
        };
      }

      let str = String(rawDate).split('T')[0];
      if (str.includes('-')) {
        let parts = str.split('-');
        if (parts.length === 3) {
          return {
            thn: parts[0],
            bln: parts[1].padStart(2, '0'),
            tglFormat: `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`,
            cleanDate: `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`
          };
        }
      }

      return { thn: '', bln: '', tglFormat: str, cleanDate: str };
    }

    function filterData() {
      const tgl = document.getElementById('filterTanggal').value;
      const bln = document.getElementById('filterBulan').value;
      const thn = document.getElementById('filterTahun').value;

      let filteredPemasukan = dataPemasukan.filter(item => {
        const parsed = parseDateString(item.tanggal);
        let matchThn = !thn || parsed.thn === thn;
        let matchBln = !bln || parsed.bln === bln;
        let matchTgl = !tgl || parsed.tglFormat === tgl;
        return matchThn && matchBln && matchTgl;
      });

      let filteredPengeluaran = dataPengeluaran.filter(item => {
        const parsed = parseDateString(item.tanggal);
        let matchThn = !thn || parsed.thn === thn;
        let matchBln = !bln || parsed.bln === bln;
        let matchTgl = !tgl || parsed.tglFormat === tgl;
        return matchThn && matchBln && matchTgl;
      });

      renderTable(filteredPemasukan, filteredPengeluaran);
    }

    function renderTable(pemasukanList, pengeluaranList) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let totalPenjualan = 0;
      let totalPengeluaran = 0;

      pengeluaranList.forEach(item => {
        let totalRow = Number(item.total) || (Number(item.jumlah || 0) * Number(item.hargaSatuan || 0));
        totalPengeluaran += totalRow;
      });

      if (!pemasukanList || pemasukanList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada data penjualan pada periode ini.</td></tr>`;
      } else {
        pemasukanList.forEach(row => {
          let omsetRow = Number(row.total) || (Number(row.jumlah || 0) * Number(row.hargaSatuan || 0));
          totalPenjualan += omsetRow;

          const parsed = parseDateString(row.tanggal);

          tbody.innerHTML += `
            <tr>
              <td><small class="fw-semibold text-secondary">${row.id || '-'}</small></td>
              <td>${parsed.cleanDate || row.tanggal || '-'}</td>
              <td>${row.kategori || '-'}</td>
              <td>${row.jumlah || 0}</td>
              <td>Rp ${Number(row.hargaSatuan || 0).toLocaleString('id-ID')}</td>
              <td class="fw-bold text-success">Rp ${Number(omsetRow).toLocaleString('id-ID')}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-warning me-1" onclick="openEditModal('${row.id}')" title="Edit Data">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteData('${row.id}')" title="Hapus Data">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });
      }

      let totalKeuntungan = totalPenjualan - totalPengeluaran;

      document.getElementById('displayTotalPenjualan').innerText = `Rp ${Number(totalPenjualan).toLocaleString('id-ID')}`;
      
      const profitElement = document.getElementById('displayTotalProfit');
      profitElement.innerText = `Rp ${Number(totalKeuntungan).toLocaleString('id-ID')}`;
      if (totalKeuntungan < 0) {
        profitElement.parentElement.classList.remove('bg-primary');
        profitElement.parentElement.classList.add('bg-danger');
      } else {
        profitElement.parentElement.classList.remove('bg-danger');
        profitElement.parentElement.classList.add('bg-primary');
      }
    }

    function openAddModal() {
      document.getElementById('formPemasukan').reset();
      document.getElementById('inputId').value = '';
      document.getElementById('inputTanggal').valueAsDate = new Date();
      document.getElementById('itemRowsContainer').innerHTML = '';
      
      addItemRow(); // Buat baris pertama secara otomatis

      document.getElementById('modalTitle').innerText = 'Catat Penjualan';
      document.getElementById('btnSubmit').innerText = 'Simpan & Potong Stok';
      document.getElementById('btnSubmit').className = 'btn btn-success';
      modalInstance.show();
    }

    function openEditModal(id) {
      const item = dataPemasukan.find(d => String(d.id) === String(id));
      if (!item) {
        alert('Data tidak ditemukan!');
        return;
      }

      const parsed = parseDateString(item.tanggal);

      document.getElementById('inputId').value = item.id;
      document.getElementById('inputTanggal').value = parsed.cleanDate;
      
      document.getElementById('itemRowsContainer').innerHTML = '';
      addItemRow(item.kategori || '', item.jumlah || 0, item.hargaSatuan || 0);

      document.getElementById('modalTitle').innerText = 'Edit Penjualan';
      document.getElementById('btnSubmit').innerText = 'Update Perubahan';
      document.getElementById('btnSubmit').className = 'btn btn-primary';
      modalInstance.show();
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;

      const id = document.getElementById('inputId').value;
      const isEdit = Boolean(id);
      const tanggal = document.getElementById('inputTanggal').value;
      const trxId = isEdit ? id : 'TRX-' + Date.now();

      // Ambil seluruh data item dari baris-baris dinamis
      const rowElements = document.querySelectorAll('.item-row');
      const items = [];

      rowElements.forEach(row => {
        const menu = row.querySelector('.item-menu').value;
        const qty = Number(row.querySelector('.item-qty').value);
        const harga = Number(row.querySelector('.item-harga').value);

        if (menu && qty > 0) {
          items.push({
            id: trxId,
            tanggal: tanggal,
            jenis: 'Pemasukan',
            kategori: menu,
            jumlah: qty,
            hargaSatuan: harga,
            total: qty * harga
          });
        }
      });

      if (items.length === 0) {
        alert('Minimal isi satu item menu dengan benar.');
        btn.disabled = false;
        return;
      }

      try {
        // Jika sedang edit, kita bisa kirim action khusus atau hapus lalu tambahkan baru dengan ID yang sama
        if (isEdit) {
          // Hapus transaksi lama terlebih dahulu, lalu masukkan baris baru
          await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'deleteTransaction', id: id })
          });
        }

        // Kirim semua item baru/edit ke backend secara berurutan atau satu per satu
        for (let itemPayload of items) {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'addTransaction', payload: itemPayload })
          });
        }

        modalInstance.hide();
        loadData();
      } catch (err) {
        alert("Gagal menyimpan transaksi.");
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteData(idTrx) {
      if (!confirm(`Apakah Anda yakin ingin menghapus transaksi ${idTrx}?`)) return;

      const payload = {
        action: 'deleteTransaction',
        id: idTrx
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        loadData();
      } catch (err) {
        alert("Gagal menghapus data.");
      }
    }

    function logout() {
      if (confirm('Apakah Anda yakin ingin keluar?')) {
        localStorage.removeItem('userSession');
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
